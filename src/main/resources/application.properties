server.port=8080
server.address=0.0.0.0
spring.application.name=WebChat
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.idle-timeout=5000
spring.datasource.hikari.max-lifetime=18000000
spring.datasource.hikari.pool-name=HikariConnPool

spring.datasource.url=jdbc:postgresql://localhost:5432/chatappdb
spring.datasource.username=postgres
spring.datasource.password=boathead1400
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=5m
# Logging Configuration
logging.level.com.example.WebChat.Security=trace
logging.level.root=info
logging.level.com.example.WebChat.Service=trace
logging.level.com.example.WebChat.Controller=trace
logging.level.com.example.WebChat.Configurations=trace
logging.file.name=log/ChatApp.log
logging.logback.rollingpolicy.clean-history-on-start=true
logging.logback.rollingpolicy.max-history=0

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB